<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="The four season palettes applied to a DeepSeek Harness window: spring pink, summer teal, autumn amber, winter blue">
  <defs>
    <linearGradient id="spring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbc6dd"/>
      <stop offset="1" stop-color="#f4b0cd"/>
    </linearGradient>
    <linearGradient id="summer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#abe2ec"/>
      <stop offset="1" stop-color="#93d5e8"/>
    </linearGradient>
    <linearGradient id="autumn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fabd89"/>
      <stop offset="1" stop-color="#eeb679"/>
    </linearGradient>
    <linearGradient id="winter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfcef8"/>
      <stop offset="1" stop-color="#adc8f2"/>
    </linearGradient>
  </defs>

  <rect width="640" height="300" fill="#f2efec"/>

  <!-- four window quadrants -->
  <g>
    <!-- spring -->
    <rect x="24" y="24" width="288" height="120" rx="10" fill="#fdf4f8"/>
    <rect x="24" y="24" width="288" height="120" rx="10" fill="none" stroke="#e0a5be" stroke-opacity="0.5"/>
    <rect x="24" y="24" width="82" height="120" rx="10" fill="url(#spring)"/>
    <rect x="70" y="24" width="36" height="120" fill="url(#spring)"/>
    <g fill="#ffffff" fill-opacity="0.6">
      <rect x="36" y="38" width="48" height="6" rx="3"/>
      <rect x="36" y="56" width="56" height="5" rx="2.5"/>
      <rect x="36" y="70" width="42" height="5" rx="2.5"/>
      <rect x="36" y="84" width="50" height="5" rx="2.5"/>
    </g>
    <g fill="#7a4055" fill-opacity="0.55">
      <rect x="124" y="42" width="88" height="6" rx="3"/>
      <rect x="124" y="58" width="130" height="4" rx="2"/>
      <rect x="124" y="70" width="112" height="4" rx="2"/>
      <rect x="124" y="82" width="122" height="4" rx="2"/>
    </g>
    <rect x="188" y="100" width="96" height="32" rx="8" fill="url(#spring)"/>

    <!-- summer -->
    <rect x="328" y="24" width="288" height="120" rx="10" fill="#eefafd"/>
    <rect x="328" y="24" width="288" height="120" rx="10" fill="none" stroke="#86cad9" stroke-opacity="0.5"/>
    <rect x="328" y="24" width="82" height="120" rx="10" fill="url(#summer)"/>
    <rect x="374" y="24" width="36" height="120" fill="url(#summer)"/>
    <g fill="#ffffff" fill-opacity="0.6">
      <rect x="340" y="38" width="48" height="6" rx="3"/>
      <rect x="340" y="56" width="56" height="5" rx="2.5"/>
      <rect x="340" y="70" width="42" height="5" rx="2.5"/>
      <rect x="340" y="84" width="50" height="5" rx="2.5"/>
    </g>
    <g fill="#1c4b57" fill-opacity="0.55">
      <rect x="428" y="42" width="88" height="6" rx="3"/>
      <rect x="428" y="58" width="130" height="4" rx="2"/>
      <rect x="428" y="70" width="112" height="4" rx="2"/>
      <rect x="428" y="82" width="122" height="4" rx="2"/>
    </g>
    <rect x="492" y="100" width="96" height="32" rx="8" fill="url(#summer)"/>

    <!-- autumn -->
    <rect x="24" y="156" width="288" height="120" rx="10" fill="#fdf6e9"/>
    <rect x="24" y="156" width="288" height="120" rx="10" fill="none" stroke="#e0b57e" stroke-opacity="0.55"/>
    <rect x="24" y="156" width="82" height="120" rx="10" fill="url(#autumn)"/>
    <rect x="70" y="156" width="36" height="120" fill="url(#autumn)"/>
    <g fill="#ffffff" fill-opacity="0.6">
      <rect x="36" y="170" width="48" height="6" rx="3"/>
      <rect x="36" y="188" width="56" height="5" rx="2.5"/>
      <rect x="36" y="202" width="42" height="5" rx="2.5"/>
      <rect x="36" y="216" width="50" height="5" rx="2.5"/>
    </g>
    <g fill="#5b3a16" fill-opacity="0.55">
      <rect x="124" y="174" width="88" height="6" rx="3"/>
      <rect x="124" y="190" width="130" height="4" rx="2"/>
      <rect x="124" y="202" width="112" height="4" rx="2"/>
      <rect x="124" y="214" width="122" height="4" rx="2"/>
    </g>
    <rect x="188" y="232" width="96" height="32" rx="8" fill="url(#autumn)"/>

    <!-- winter -->
    <rect x="328" y="156" width="288" height="120" rx="10" fill="#f1f6ff"/>
    <rect x="328" y="156" width="288" height="120" rx="10" fill="none" stroke="#96b4da" stroke-opacity="0.55"/>
    <rect x="328" y="156" width="82" height="120" rx="10" fill="url(#winter)"/>
    <rect x="374" y="156" width="36" height="120" fill="url(#winter)"/>
    <g fill="#ffffff" fill-opacity="0.6">
      <rect x="340" y="170" width="48" height="6" rx="3"/>
      <rect x="340" y="188" width="56" height="5" rx="2.5"/>
      <rect x="340" y="202" width="42" height="5" rx="2.5"/>
      <rect x="340" y="216" width="50" height="5" rx="2.5"/>
    </g>
    <g fill="#20344f" fill-opacity="0.55">
      <rect x="428" y="174" width="88" height="6" rx="3"/>
      <rect x="428" y="190" width="130" height="4" rx="2"/>
      <rect x="428" y="202" width="112" height="4" rx="2"/>
      <rect x="428" y="214" width="122" height="4" rx="2"/>
    </g>
    <rect x="492" y="232" width="96" height="32" rx="8" fill="url(#winter)"/>
  </g>

</svg>
