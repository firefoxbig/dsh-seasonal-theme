name: dsh-seasonal-theme

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify the bundle manifest
        run: |
          node --check index.js
          node --check client.js
          node -e "const p=require('./package.json');if(!p.dsh?.bundle?.patch)throw new Error('missing dsh.bundle.patch');if(!p.exports['./client'])throw new Error('missing ./client export');console.log('manifest ok', p.name, p.version)"

      - name: Check the packed file list
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
